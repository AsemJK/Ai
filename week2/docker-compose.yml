   version: '3.8'
   services:
     qdrant:
       image: qdrant/qdrant:latest
       container_name: qdrant
       ports:
         - "6333:6333" # REST API
         - "6334:6334" # gRPC
       volumes:
         - qdrant_data:/qdrant/storage
       restart: always

   volumes:
     qdrant_data:
       # This creates a named Docker volume managed by Docker.
       # It persists even if you run `docker-compose down`.