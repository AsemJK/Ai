services:
  ovms-download:
    image: openvino/model_server:latest
    container_name: ovms-download
    user: root
    volumes:
      - ./models:/models:rw
    command: >
      --pull
      --model_repository_path /models
      --source_model OpenVINO/Qwen3-8B-int4-ov
      --task text_generation
      --tool_parser hermes3
    restart: "no"

  ovms-server:
    image: openvino/model_server:latest
    container_name: ovms-server
    user: root
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    command: >
      --rest_port 8000
      --model_name OpenVINO/Qwen3-8B-int4-ov
      --model_path /models/OpenVINO/Qwen3-8B-int4-ov
    depends_on:
      ovms-download:
        condition: service_completed_successfully
    restart: unless-stopped